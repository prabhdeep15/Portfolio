<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blog — redirect</title>
    <!-- Same URL as BLOG_URL in src/App.jsx -->
    <script>
      (function () {
        var BLOG_REDIRECT_TARGET = "https://hashnode.com/@Prabhdeep15/";
        if (BLOG_REDIRECT_TARGET) {
          var m = document.createElement("meta");
          m.httpEquiv = "refresh";
          m.content = "0;url=" + BLOG_REDIRECT_TARGET;
          document.head.appendChild(m);
          location.replace(BLOG_REDIRECT_TARGET);
        }
      })();
    </script>
  </head>
  <body
    style="
      margin: 0;
      font-family: system-ui, sans-serif;
      background: #0a0a0c;
      color: #c9c2d9;
      display: flex;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      text-align: center;
    "
  >
    <p style="max-width: 22rem; line-height: 1.55; font-size: 0.95rem">
      Redirecting… If nothing happens, open <code>BLOG_URL</code> in <code>src/App.jsx</code>.
    </p>
  </body>
</html>
